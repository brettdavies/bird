[package]
name = "bird"
version = "0.2.0"
edition = "2024"
description = "X API CLI with entity caching, search, threads, and watchlists"
license = "MIT OR Apache-2.0"
repository = "https://github.com/brettdavies/bird"
homepage = "https://github.com/brettdavies/bird"
documentation = "https://docs.rs/bird"
keywords = ["x", "api", "cli", "oauth", "posts"]
categories = ["command-line-utilities", "web-programming::http-client"]
authors = ["Brett Davies <pm8fp22mbg@privaterelay.appleid.com>"]
readme = "README.md"
rust-version = "1.94"
exclude = [
    ".anc.toml",
    ".claude/",
    ".context/",
    ".github/",
    ".markdownlint-cli2.yaml",
    "cliff.toml",
    "CONCEPTS.md",
    "deny.toml",
    "docs/",
    "rustfmt.toml",
    "scripts/",
    "tests/",
    "todos/",
]

[lib]
name = "bird"
path = "src/lib.rs"

[[bin]]
name = "bird"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1"
toml = "1.1"
dirs = "7.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11"
url = "2.5"
owo-colors = { version = "4", features = ["supports-color"] }
rusqlite = { version = "0.38", features = ["bundled"] }
rusqlite_migration = "2.4"
toml_edit = "0.25"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["now"] }
libc = "0.2"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
tokio-util = "0.7"
open = "5"
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }

[dependencies.xdk]
package = "xdk-rs"
version = "0.2.0"
git = "https://github.com/brettdavies/xurl-rs"
rev = "f6cec235571075a20c242a5d5dbd839f27bf6926" # xurl-rs dev after xdk-rs 0.2.0: serde-saphyr in place of serde_yaml (brettdavies/xurl-rs#348)

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.4", default-features = false }

[build-dependencies]
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
pulldown-cmark = { version = "0.13", default-features = false }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/bird-{ target }.tar.gz"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/bird-{ target }.zip"
pkg-fmt = "zip"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
