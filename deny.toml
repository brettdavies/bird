# cargo-deny policy. See `cargo deny check` documentation:
# https://embarkstudios.github.io/cargo-deny/

[graph]
# The seven release triples. Restricting the graph to them drops audit
# coverage for any other host by policy: the release builds nothing else, and
# target-only branches of the tree would otherwise add duplicates and licenses
# that never ship.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# bird declares no features of its own; `true` keeps the audit covering any
# that arrive without a policy edit.
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = false
skip = [
    { crate = "base64@0.22", reason = "hyper-util and serde-saphyr lag the 0.23 that reqwest and xdk-rs use" },
    { crate = "getrandom@0.3", reason = "tempfile lags the 0.4 that cc's jobserver uses at build time" },
    { crate = "syn@2", reason = "displaydoc and the other proc-macro crates on the icu path lag syn 3" },
    { crate = "windows-sys@0.52", reason = "rustls-platform-verifier and winapi-util lag 0.61" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
