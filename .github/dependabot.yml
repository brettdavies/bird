# Dependabot configuration.
#
# Two ecosystems: cargo for Rust dependencies, github-actions for workflow
# actions. Both scan weekly on Monday mornings against `dev`, with a seven
# day cooldown so a release is at least a week old before it is proposed.
# Every minor and patch update batches into one PR per ecosystem per week;
# majors are ignored here and land through a deliberate bump on dev.
#
# `target-branch: dev` is non-negotiable on every version-update block.
# Without it, Dependabot defaults to `main` and the PR fails the dev ->
# release/* -> main flow that guard-release-branch.yml enforces. Retargeting
# after the fact orphans-and-closes the PR irreversibly.
#
# Security updates are the exception: Dependabot raises them against the
# default branch and ignores every option on a block that carries
# `target-branch`, so without a block of their own each advisory becomes its
# own ungrouped PR on main. The trailing block has no target-branch,
# `open-pull-requests-limit: 0` so it never opens version updates there, and
# a group with `applies-to: security-updates` that batches minor and patch
# fixes per run. A fix that needs a major stays its own PR. Cooldown, the
# majors ignore, and lockfile pinning are deliberately absent from it:
# cooldown is a version-update option, and the other two would suppress a
# fix that resolves outside the current range.
#
# The github-actions group uses `patterns` rather than `update-types`
# because a SHA pin's SemVer level comes from a trailing comment and an
# unclassifiable action would otherwise fall out of the group and open alone.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    reviewers:
      - brettdavies
    labels:
      - dependencies
      - rust
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    reviewers:
      - brettdavies
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-patch:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - security
    groups:
      cargo-security-minor-patch:
        applies-to: security-updates
        update-types:
          - minor
          - patch
