# Canonical version: 2026.11.03 (rust)
#
# Source repo CI wrapper: calls the centralized reusable workflows.
# Copy to .github/workflows/ci.yml in the tool repo.
#
# rust-change-scope.yml decides whether the change can reach cargo at all, by
# the repo's scripts/cargo-inputs.sh (copy it verbatim from rust-tool-release).
# Without that script the scope job fails, and every Rust job runs.
# rust-ci.yml runs fmt, clippy, test, cargo-deny check, package check, Windows
# check, and changelog verification (on PRs to main), plus each job an input
# below turns on.
# lint-basics.yml runs actionlint and markdownlint.
# No secrets required: only contents: read and pull-requests: read.
#
# Checks run on pull requests only: merges to main and dev are squash merges,
# so the merge commit's tree equals the PR head this workflow already verified,
# and a push run would re-check an identical tree for no new signal. The
# compensating local gate is the hook pair at scripts/hooks/, which mirrors
# these jobs before the push leaves the machine.
#
# A push to dev, or a manual dispatch, is a warm run: it runs no check and
# fills the caches pull requests restore. A pull request restores from its own
# ref, its base branch, and the default branch, and only a run outside a pull
# request can write those two branches' scopes, so without warm runs every new
# pull request builds its dependencies cold. finalize-release.yml dispatches a
# warm run on main once a release is marked latest, so the release merge starts
# no run beside the release's own.
name: CI

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# The group key leads with a literal token naming this workflow. A key built
# only from context (`${{ github.workflow }}`) is one the reusables called below
# also produce, because `github.workflow` resolves to this caller's name inside
# a called workflow; both then land in one group and a reusable's queue cancels
# this run. The reusables carry their own `rust-ci-` and `lint-basics-` tokens.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether the change can reach cargo, by scripts/cargo-inputs.sh. A
  # documentation-only PR skips every Rust job, and a skipped job reports
  # success, so required checks still pass. The `ci` job runs unless this
  # answered `false`, so a scope job that fails runs the full battery.
  scope:
    if: github.event_name == 'pull_request'
    uses: brettdavies/.github/.github/workflows/rust-change-scope.yml@main

  ci:
    needs: scope
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    uses: brettdavies/.github/.github/workflows/rust-ci.yml@main
    # Every rust-ci input, one line each. The reusable's
    # on.workflow_call.inputs holds each one's full description and default.
    #   advisories_blocking         an advisory fails the run (set below)
    #   docs_only                   skip every job (set below, from the scope job)
    #   cross_os_tests              run cargo test on Windows and macOS too
    #   docs                        cargo doc with warnings denied (set below)
    #   msrv                        cargo check on the root Cargo.toml's rust-version (set below), which
    #                               equals rust-toolchain.toml's channel, so it builds on the pinned toolchain
    #   completions                 scripts/generate-completions.sh --check (rust-tool-release)
    #   lint_stdio                  scripts/lint-stdio.sh (rust-tool-release skeleton)
    #   workflow_concurrency        scripts/check-workflow-concurrency.sh (github-repo-setup)
    #   anc_version, anc_bin        the agent-native audit at an exact anc release, on the named binary
    #   anc_score_floor             the lowest badge score that audit accepts
    #   anc_blocking_tiers          which failing audit rows block: `must` or `any`
    #   release_size_ceiling_bytes  with anc_version set, the largest release binary allowed
    with:
      # An advisory turns this run red rather than leaving it green with one
      # failed job, so the run's colour matches what a human scanning the
      # Actions tab should act on.
      advisories_blocking: true
      docs_only: ${{ needs.scope.outputs.rust == 'false' }}
      # A release ships for Linux, macOS, and Windows, and paths, file modes,
      # renames, and locks behave differently on each.
      cross_os_tests: true
      docs: true
      msrv: true
      completions: true
      lint_stdio: true
      workflow_concurrency: true
      # Every `fail` row blocks, source rows included, not only MUST-tier ones.
      # The floor is the score this tree reports; raise it when the score does.
      anc_version: &anc-version "0.6.0"
      anc_bin: &anc-bin bird
      anc_blocking_tiers: any
      anc_score_floor: 99

  # Builds what each `ci` job compiles with execution off, and saves each job's
  # cache only when the job succeeds. Its checks report as `warm / <job>`, never
  # under a required `ci / <job>` name, and rust-cache keys on the reusable's job
  # ids, not this caller's, so a pull request's keys match the ones saved here.
  # Each input that turns on a job keeping a cache is set here as in `ci`, or that
  # job's cache stays cold; the jobs that keep none skip in a warm run.
  warm:
    if: github.event_name != 'pull_request'
    uses: brettdavies/.github/.github/workflows/rust-ci.yml@main
    with:
      warm_cache: true
      cross_os_tests: true
      docs: true
      msrv: true
      completions: true
      anc_version: *anc-version
      anc_bin: *anc-bin

  # The planning archives (docs/plans, docs/brainstorms) never ship to main and
  # carry long lines and unaligned tables the rules reject; every document that
  # ships is linted. CHANGELOG.md is generated and wraps where the generator
  # wraps. .claude/ is a gitignored symlink, absent from this checkout.
  # A repo whose own lint.yml already calls lint-basics drops this job: both
  # report as `lint / <job>`, so the same checks would run twice under one name.
  lint:
    if: github.event_name == 'pull_request'
    uses: brettdavies/.github/.github/workflows/lint-basics.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      markdownlint-globs: |
        **/*.md
        !CHANGELOG.md
        !.claude/**
        !docs/plans/**
        !docs/brainstorms/**
