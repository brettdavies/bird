# Source repo CI wrapper — calls the centralized reusable workflow.
# Copy to .github/workflows/ci.yml in the tool repo.
#
# The reusable workflow runs: fmt, clippy, test, cargo-deny audit, package check,
# Windows dep check, and changelog verification (on PRs to main).
# No secrets required — only needs contents: read and pull-requests: read.
#
# Push trigger is scoped to main/dev only — feature branches get CI via
# pull_request. This prevents duplicate runs when a branch push and PR
# creation fire seconds apart. tags-ignore prevents CI on release tag pushes
# (the release workflow handles those). paths-ignore skips doc-only pushes.
# paths-ignore is NOT applied to pull_request to avoid blocking required
# status checks when a PR only touches ignored paths.
name: CI

on:
  push:
    branches: [main, dev]
    tags-ignore: ['**']
    paths-ignore:
      - '**.md'
      - 'LICENSE-*'
      - 'docs/**'
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  # Whether the change can reach cargo, by scripts/cargo-inputs.sh. A
  # documentation-only PR skips every Rust job, and a skipped job reports
  # success, so required checks still pass. The `ci` job runs unless this
  # answered `false`, so a scope job that fails runs the full battery.
  scope:
    uses: brettdavies/.github/.github/workflows/rust-change-scope.yml@feat/rust-change-scope

  ci:
    needs: scope
    if: ${{ !cancelled() }}
    uses: brettdavies/.github/.github/workflows/rust-ci.yml@feat/rust-ci-opt-in-jobs
    with:
      docs_only: ${{ needs.scope.outputs.rust == 'false' }}
      docs: true
      msrv: true
      completions: true
      lint_stdio: true
      workflow_concurrency: true
