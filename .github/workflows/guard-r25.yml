# Plan 1 R25 guard: BIRD_XURL_PATH must not appear in tests/cli_smoke.rs.
#
# The library-style cli_smoke.rs runs in-process via bird::cli::run_with_paths
# and shares one process across tests. transport.rs caches the resolved xurl
# path in an OnceLock, so any test that mutates BIRD_XURL_PATH poisons later
# tests. The carve-out lives in tests/cli_smoke_subprocess.rs (each test in
# its own forked binary). This guard keeps the rule enforceable.
name: Guard R25 (BIRD_XURL_PATH)

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  guard-r25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: BIRD_XURL_PATH not in cli_smoke.rs
        run: |
          if grep -q 'BIRD_XURL_PATH' tests/cli_smoke.rs; then
            echo "::error file=tests/cli_smoke.rs::BIRD_XURL_PATH appears in library-style cli_smoke.rs — move the test to tests/cli_smoke_subprocess.rs (Plan 1 R25)."
            exit 1
          fi
