# Source repo dependabot-preflight wrapper: calls the centralized reusable
# workflow on demand.
#
# Enumerates pending dependency updates (cargo outdated report, pinned-action
# drift table) before a release branch is cut, so they merge on dev or are
# rejected instead of arriving as Dependabot PRs the moment the release commit
# lands. Trigger from Actions -> "Dependabot Preflight" -> "Run workflow" as
# the first step of RELEASES-PREFLIGHT.md § Dependabot preflight.
name: Dependabot Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    uses: brettdavies/.github/.github/workflows/dependabot-preflight.yml@80c9cd65c9c8aa2516119b50e1c63b91e2dbea3b # main as of 2026-09-07
