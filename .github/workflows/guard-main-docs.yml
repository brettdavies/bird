# Source repo guard-main-docs wrapper — calls the centralized reusable workflow.
#
# Blocks compound-engineering docs (plans, solutions, brainstorms, reviews)
# from being merged into main, plus this repo's extra_paths. Only needs
# pull-requests: read.
#
# extra_paths entries are globs: `**/` spans any depth, `*` and `?` stay
# within one segment, a trailing `/` guards the subtree, and a plain entry is
# a prefix or an exact path. scripts/release/guarded-paths.sh reads this line,
# so keep it on one line in single quotes.
name: Guard main from engineering docs

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: read

jobs:
  guard-docs:
    uses: brettdavies/.github/.github/workflows/guard-main-docs.yml@main
    with:
      extra_paths: 'CONCEPTS.md'
