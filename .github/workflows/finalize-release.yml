# Canonical version: 2026.10.22 (rust)
#
# Source repo finalize-release wrapper — calls the centralized reusable workflow.
# Copy to .github/workflows/finalize-release.yml in the tool repo.
#
# Triggered by repository_dispatch from homebrew-tap's publish workflow
# once the formula bump lands. Marks the GitHub Release latest, then starts
# the warm runs of CI and Build examples on `main`.
#
# The release merge starts no CI run, so the release has the account's runners
# to itself; `main`'s caches, which release pull requests restore, fill here
# instead, once the release is out.
name: Finalize Release

on:
  repository_dispatch:
    types: [finalize-release]

permissions:
  contents: write

jobs:
  finalize:
    uses: brettdavies/.github/.github/workflows/rust-finalize-release.yml@main

  warm-main:
    needs: finalize
    permissions:
      actions: write
    uses: brettdavies/.github/.github/workflows/warm-dispatch.yml@main
    with:
      workflows: ci.yml build-examples.yml
