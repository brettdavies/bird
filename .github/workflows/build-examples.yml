# Guards that the in-process library examples under `examples/` stay
# compiling. The shared `rust-ci.yml` reusable workflow runs `cargo build`
# against the default targets, which does not include `examples/`; a broken
# example would otherwise only surface when a downstream consumer copied
# the snippet. Mirrors the per-repo wrapper pattern used by the other
# guard workflows.
name: Build examples

on:
  push:
    branches: [main, dev]
    tags-ignore: ['**']
    paths-ignore:
      - '**.md'
      - 'LICENSE-*'
      - 'docs/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - name: cargo build --examples
        run: cargo build --workspace --examples --locked
