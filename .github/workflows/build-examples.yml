# Guards that the in-process library examples under `examples/` stay
# compiling. The shared `rust-ci.yml` reusable workflow runs `cargo build`
# against the default targets, which does not include `examples/`; a broken
# example would otherwise only surface when a downstream consumer copied
# the snippet. Mirrors the per-repo wrapper pattern used by the other
# guard workflows.
name: Build examples

on:
  push:
    branches: [main, dev]
    tags-ignore: ['**']
    paths-ignore:
      - '**.md'
      - 'LICENSE-*'
      - 'docs/**'
  pull_request:

permissions:
  contents: read

# The group key leads with a literal token naming the workflow that owns it. A
# key built only from context (`${{ github.workflow }}`) is one a called
# reusable also produces, because `github.workflow` resolves to the caller
# inside a called workflow; both land in one group and the reusable's queue
# cancels the run that called it.
concurrency:
  group: build-examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - name: cargo build --examples
        run: cargo build --workspace --examples --locked
