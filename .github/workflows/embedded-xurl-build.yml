# Build-only guard for the `embedded-xurl` Cargo feature during the
# 3-PR xurl-rs cutover (refactor: embed xurl-rs v2.0.0 as a library).
# The shared `rust-ci.yml` reusable workflow exercises the default
# (subprocess) transport. This sibling workflow builds the embedded
# transport path so it stays compilable while handler bodies are still
# being migrated unit-by-unit across PR1 -> PR2 -> PR3.
#
# Build-only on purpose: PR1's embedded-arm handler bodies are stub
# methods returning a benign error (see U3 of the plan), and PR2
# replaces them with real impls. Running `cargo test --features
# embedded-xurl` in PR1 would exercise the stubs and report misleading
# failures. The cutover commit (PR3) removes this workflow once the
# subprocess transport and the feature flag are gone.
#
# Mirrors the per-repo wrapper pattern used by `build-examples.yml`.
name: Build (embedded-xurl)

on:
  push:
    branches: [main, dev]
    tags-ignore: ['**']
    paths-ignore:
      - '**.md'
      - 'LICENSE-*'
      - 'docs/**'
  pull_request:

permissions:
  contents: read

jobs:
  build-embedded:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flags:
          - "--features embedded-xurl"
          - "--no-default-features --features embedded-xurl"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - name: cargo build ${{ matrix.flags }}
        run: cargo build --locked ${{ matrix.flags }}
