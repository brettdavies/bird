# Canonical version: 2026.11.02 (rust)
#
# Builds every target the release matrix builds, without releasing anything.
# Copy to .github/workflows/release-matrix-check.yml in the tool repo.
#
# A release compiles its binaries once, on the `v*` tag push. What breaks a
# cross-compiled target is a change to the dependency graph or the toolchain
# pin, so a pull request to `dev` that makes one pays this matrix, and the tag
# builds a graph every such change already built.
#
# Nothing here runs for a release. A release pull request targets `main`, and
# its version bump would match the paths below; the backport of that bump to
# `dev` matches them too and changes no dependency. `workflow_dispatch` runs
# the matrix on any ref, a release branch included, when a release wants a
# rehearsal.
#
# The matrix and its build steps live in the shared workflow this calls, beside
# the release workflow whose matrix they mirror. Every row is hard-fail there,
# and the release workflow runs with `linux_musl_required: true`, so its musl
# rows are hard-fail too. A red musl row in this check means the release would
# fail on the same row.
name: Release matrix check

on:
  workflow_dispatch:
  # A workspace adds its members' manifests (`crates/*/Cargo.toml`).
  pull_request:
    branches:
      - dev
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/release-matrix-check.yml

permissions:
  contents: read

concurrency:
  group: release-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # `scripts/sync-dev-after-release.sh` names the backport's branch.
    if: ${{ !startsWith(github.head_ref, 'chore/sync-dev') }}
    uses: brettdavies/.github/.github/workflows/rust-release-matrix-check.yml@main
