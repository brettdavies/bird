# Plan 2 R20 guard: writer-injection compliance. Every call site that emits
# user-visible output must use an injected &mut dyn Write writer (or an
# OutputConfig::print_* method) — never the bare println!/eprintln! family
# or the deleted out_println!/out_print!/diag! macros. The only permitted
# survivors are:
#   - src/main.rs (binary shim — no output today, future-proofed)
#   - src/error/fatal.rs (the fatal-error chokepoint, intentionally bare)
# Anywhere else in src/ — including elsewhere in src/error/ — the guard fires.
name: Guard R20 (writer-injection)

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

# The group key leads with a literal token naming the workflow that owns it. A
# key built only from context (`${{ github.workflow }}`) is one a called
# reusable also produces, because `github.workflow` resolves to the caller
# inside a called workflow; both land in one group and the reusable's queue
# cancels the run that called it.
concurrency:
  group: guard-r20-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-r20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: No bare output macros outside src/error/fatal.rs and src/main.rs
        run: |
          forbidden=$(rg -n '\b(println|eprintln|print|eprint|out_println|out_print|diag)!' \
              --glob 'src/**/*.rs' \
              --glob '!src/main.rs' \
              --glob '!src/error/fatal.rs' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::Forbidden output macro in src/. Use an injected &mut dyn Write writer or OutputConfig::print_* method (Plan 2 R20)."
            echo "$forbidden"
            exit 1
          fi
